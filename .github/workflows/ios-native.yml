name: Native iOS build
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - 'native/**'
      - 'src/native/**'
      - 'src/engine/**'
      - 'src/host/**'
      - 'src/params/**'
      - 'src/profiles/**'
      - 'src/ui/model/**'
      - 'src/shaders/**'
      - 'public/data/**'
      - 'public/luts/**'
      - 'package-lock.json'
      - '.github/workflows/ios-native.yml'
permissions:
  contents: read
concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Build canonical native host and assets
        run: |
          npm ci
          npm run typecheck
          node ios/scripts/build_host.mjs
      - name: Install Rust
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
      - name: Rust tests on Metal
        working-directory: native
        run: |
          node scripts/curve_fixture.mjs --check
          cargo test --features gpu-tests --locked -- --test-threads=1
      - name: Build native XCFramework
        run: |
          bash ios/scripts/build_native.sh
          bash ios/scripts/build_raw.sh
      - name: Compile the SwiftUI app (device and simulator)
        working-directory: ios
        run: |
          xcodebuild -scheme Dichroic -destination 'generic/platform=iOS' -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO build
          xcodebuild -scheme Dichroic -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO build
      # xtool on Linux/WSL builds against these: copy them into ios/ there.
      - uses: actions/upload-artifact@v4
        with:
          name: dichroic-native-xcframework
          path: ios/Frameworks/DichroicNative.xcframework
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: dichroic-engine-resources
          path: ios/Sources/DichroicEngine/Resources
          if-no-files-found: error
