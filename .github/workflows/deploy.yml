# Membangun PWA dan menerbitkannya ke GitHub Pages setiap kali main berubah.
# Aktifkan sekali: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
# Pages tidak bisa memasang header COOP/COEP; service worker (src/sw.ts) yang
# menambahkannya, jadi decoder RAW tersedia mulai muat ulang pertama.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Build
        run: npm run build
        env:
          # Situs proyek Pages disajikan di /<nama-repo>/.
          DICHROIC_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
