workflows:
  dichroic-ios-swift:
    name: DICHROIC iOS (Swift)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      node: 24
    cache:
      cache_paths:
        - $HOME/.cargo/registry
        - $HOME/.cargo/git
    scripts:
      - name: Build canonical native host and assets
        script: |
          set -euo pipefail
          npm ci
          npm run typecheck
          node ios/scripts/build_host.mjs
      - name: Install Rust
        script: |
          set -euo pipefail
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          source "$HOME/.cargo/env"
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
      - name: Build native device and simulator library
        script: |
          set -euo pipefail
          source "$HOME/.cargo/env"
          bash ios/scripts/build_native.sh
          bash ios/scripts/build_raw.sh
      - name: Compile the SwiftUI app
        script: |
          set -euo pipefail
          cd ios
          xcodebuild -scheme Dichroic -destination 'generic/platform=iOS' -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - ios/Frameworks/DichroicNative.xcframework/**
      - ios/Sources/DichroicEngine/Resources/**
